[project]
name = "tab-expansion-to-minimum-width"
version = "0.1.2"
description = "Expands tab characters to the minimum number of spaces required to reach the next multiple of the configured tab width on each line."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
